<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ISA Tendencias · Catálogo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap">
<style>
:root{--bg:#050b18;--bg2:#0b1d3d;--card:#0d1a31cc;--ink:#eef2fb;--mut:#8d9bb8;--gold:#e8c071;--cy:#5ee1ff;--line:#ffffff1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eaf0fa;--bg2:#cfdcf2;--card:#ffffffd9;--ink:#0b1a35;--mut:#52617f;--line:#0b1a3226;color-scheme:light}}
:root[data-theme="light"]{--bg:#eaf0fa;--bg2:#cfdcf2;--card:#ffffffd9;--ink:#0b1a35;--mut:#52617f;--line:#0b1a3226;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 14px/1.45 Sora,system-ui,sans-serif;max-width:560px;margin-inline:auto;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.bgm{position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 80% at 50% 0,var(--bg2),var(--bg) 70%);overflow:hidden}
.bl{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:.45;animation:dr 18s ease-in-out infinite alternate}
.b1{background:#1d4ed8;left:-20vmax;top:-10vmax}.b2{background:var(--gold);right:-30vmax;top:30vh;opacity:.22;animation-duration:24s}.b3{background:#06b6d4;left:-10vmax;bottom:-30vmax;opacity:.3;animation-duration:21s}
@keyframes dr{to{transform:translate(18vmax,10vmax) scale(1.2)}}
.gr{position:absolute;left:-50%;right:-50%;bottom:-10vh;height:55vh;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 48px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/48px 100%;transform:perspective(320px) rotateX(62deg);animation:gm 3s linear infinite;mask:linear-gradient(transparent,#000 70%)}
@keyframes gm{to{background-position:0 48px,0 0}}
#cv{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
.hero{position:relative;overflow:hidden;text-align:center;padding:44px 20px 24px;border-radius:0 0 28px 28px;color:#eef2fb}.cov{position:absolute;inset:0;background-size:cover;background-position:center;animation:kb 22s ease-in-out infinite alternate}.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#050b18b3,#050b18e8)}.hero h1,.hero p{position:relative;z-index:1}.lg{z-index:1}@keyframes kb{to{transform:scale(1.18)}}
.lg{position:relative;width:104px;height:104px;margin:auto}.lg::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(var(--gold),var(--cy),#fff,var(--gold));animation:sp 5s linear infinite;filter:blur(1.5px)}.lg img{position:relative;width:100%;height:100%;border-radius:50%;display:block}
@keyframes sp{to{transform:rotate(1turn)}}
.hero h1{font:700 27px/1.15 Sora;margin:18px 0 6px;background:linear-gradient(90deg,#fff,var(--gold),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--cy)}
.ship{margin:12px 14px 0;text-align:center;font-size:12px;color:var(--mut);padding:9px 12px;border:1px solid var(--line);border-radius:30px;background:var(--card);backdrop-filter:blur(10px)}.ship b{color:var(--gold);font-weight:600}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:12px 14px 8px;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 72%,transparent)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;font:600 12px Sora;border-radius:30px;cursor:pointer;transition:.2s}
.tab.on{background:linear-gradient(135deg,var(--gold),#c98f2b);color:#2a1b00;border-color:transparent;box-shadow:0 0 18px #e8c07188}
.search{width:100%;margin-top:8px;padding:12px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:300 14px Sora;border-radius:30px;outline:0}.search:focus{border-color:var(--cy);box-shadow:0 0 14px #5ee1ff55}
.sizes{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:10px;letter-spacing:2px;color:var(--mut)}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:36px;padding:6px 9px;font:600 11px Sora;border-radius:9px;cursor:pointer;box-shadow:0 3px 0 #0006;transition:.12s}.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #0006}
.chip.on{background:linear-gradient(180deg,var(--cy),#1aa7d6);color:#03212b;border-color:transparent;box-shadow:0 3px 0 #0b6f8f,0 0 14px #5ee1ff99}
.hd{display:flex;justify-content:space-between;align-items:baseline;padding:16px 16px 4px}.hd h2{font:700 22px Sora;margin:0}.hd span{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 14px;perspective:900px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;backdrop-filter:blur(10px);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s;animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(180px circle at var(--mx,50%) var(--my,0%),#ffffff26,transparent 60%);pointer-events:none}
.art{position:relative;aspect-ratio:4/5;display:grid;place-items:center;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--c) 38%,transparent),transparent 68%)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes fl{50%{transform:translateY(-8px) rotate(-1.5deg)}}
.bdg{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#ff4d8d,#ff8a3d);color:#fff;font:700 11px Sora;padding:4px 9px;border-radius:20px;box-shadow:0 0 14px #ff4d8d88}
.in{padding:4px 11px 13px;display:flex;flex-direction:column;gap:8px;flex:1}
.nm{font:600 13px/1.25 Sora}.tl{display:flex;gap:4px;flex-wrap:wrap}.tl .chip{min-width:28px;padding:3px 6px;font-size:10px;box-shadow:0 2px 0 #0006}
.pr{display:flex;align-items:baseline;gap:6px}.pr b{font:700 19px Sora;color:var(--gold)}.pr s{color:var(--mut);font-size:11px}.bs{color:var(--mut);font-size:10.5px;margin-top:-5px}
.btn{margin-top:auto;border:0;background:linear-gradient(180deg,#f3d089,var(--gold) 55%,#c98f2b);color:#2a1b00;padding:11px;font:700 12px Sora;letter-spacing:1.5px;text-transform:uppercase;border-radius:12px;cursor:pointer;box-shadow:0 5px 0 #8a5d12,0 8px 18px #e8c07166,inset 0 1px 0 #fff9;transition:.1s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8a5d12,0 2px 8px #e8c07155,inset 0 1px 0 #fff9}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0}
.foot{text-align:center;color:var(--mut);font-size:11px;padding:24px 20px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;background:linear-gradient(180deg,#f3d089,var(--gold) 55%,#c98f2b);color:#2a1b00;border:0;padding:15px 22px;border-radius:40px;font:700 12px Sora;letter-spacing:1.5px;box-shadow:0 5px 0 #8a5d12,0 0 28px #e8c071aa;cursor:pointer;animation:pl 2.4s ease-in-out infinite}.fab:active{transform:translateY(4px)}
@keyframes pl{50%{box-shadow:0 5px 0 #8a5d12,0 0 42px #e8c071}}
.sh{position:fixed;inset:0;z-index:40;background:#0009;backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}.sh.on{display:flex}
.pn{background:var(--bg);border:1px solid var(--line);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px #5ee1ff22}
.pn h3{font:700 22px Sora;margin:0 0 8px;display:flex;justify-content:space-between}.pn h3 button{border:0;background:none;color:var(--ink);font-size:24px;cursor:pointer}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.it small{color:var(--mut)}
.q{display:flex;align-items:center;gap:8px}.q button{width:30px;height:30px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:50%;cursor:pointer}
.tot{display:flex;justify-content:space-between;font:700 22px Sora;padding:14px 0 2px;color:var(--gold)}
.pn input,.pn textarea{width:100%;margin-top:8px;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:300 14px Sora;border-radius:12px}
.pn .btn{width:100%;margin-top:16px;padding:14px;font-size:13px}.lnk{display:block;text-align:center;margin-top:14px;color:var(--mut);font-size:13px;background:none;border:0;width:100%;cursor:pointer}
.ts{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--cy);color:#03212b;font-weight:600;padding:9px 18px;border-radius:30px;font-size:13px;z-index:50;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 0 22px #5ee1ffaa}.ts.on{opacity:1}
.card .art,.card .nm{cursor:pointer}
.md{position:fixed;inset:0;z-index:45;background:#000a;backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:14px}.md.on{display:flex}
.mp{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:22px;width:100%;max-width:440px;max-height:92vh;overflow:auto;box-shadow:0 0 50px #5ee1ff33;animation:in .3s both}
.mp img{width:100%;aspect-ratio:4/5;max-height:54vh;object-fit:cover;display:block}
.mx{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#000a;color:#fff;font-size:22px;cursor:pointer;z-index:2}
.mb{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}.mb small{color:var(--cy);letter-spacing:2px;text-transform:uppercase;font-size:11px}.mb h3{font:700 21px/1.2 Sora;margin:0}.mb p{margin:0;color:var(--mut);font-size:13.5px;line-height:1.55}.mb .pr b{font-size:26px}.mb .btn{margin-top:10px;padding:14px;font-size:13px}
.gps{width:100%;margin-top:12px;padding:12px;border:1px solid var(--cy);background:transparent;color:var(--cy);border-radius:12px;font:600 13px Sora;cursor:pointer;box-shadow:0 0 14px #5ee1ff33}.gps:active{transform:scale(.98)}.gst{font-size:12px;color:var(--mut);margin-top:6px;min-height:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
